<!DOCTYPE html>
<html>
    <head>
        <title>My Pet Page</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: bisque;
                padding: 65px 30px 30px 30px;
                min-height: 1800px;
            }
            h1,
            h2 {
                color: orangered;
            }
            .top-bar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background-color: orange;
                color: aqua;
                padding: 14px 20px;
            }
            .list-item {
                background-color: white ;
                border: 2px solid darkorange;
                padding: 10px 20px;
                margin: 5px 0;
            }
            .special-note {
                position: relative;
                left: 30px;
                background-color: goldenrod;
                padding: 10px 25px;
            }
            .pet-card {
                position: relative;
                background-color: white ;
                border: 3px solid darkgoldenrod;
                padding: 15px 25px;
            }
            .badge {
                position: absolute;
                top: 8px;
                right: 8px;
                background-color: forestgreen;
                color: white;
                padding: 4px 8px;
            }
            .section-label {
                position: sticky;
                top: 55px;
                background-color: darkorange;
                color: whitesmoke;
                padding: 10px 20px;
                margin: 15px 0 8px;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">My Pet Page - Buddy the Labrador</div>
        <h1>Meet Buddy!</h1>
        <h2>Static</h2>
        
        <div class="list-item">Breed: Labrador</div>
        <div class="list-item">Age: 2Years old</div>
        <h2>Relative</h2>
        <div class="special-note">Pet of the month!</div>
        <h2>Absolute</h2>
        <div class="pet-card">
            <p>Buddy - Labrador , 2Years</p>
        <div class="badge">Adopted!</div>
        </div>
        <h2>Sticky</h2>
        <div class="section-label">More Pets Available</div>
        <div class="list-item">Luna - Poodle , 1Year</div>
    </body>
</html>
