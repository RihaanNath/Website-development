<!DOCTYPE html>
<html>
    <head>
        <title>My Animal Fact File</title>
        <style>
            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 10px solid yellowgreen;
                margin: 50px;
            }
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }
            .detail {
                color: darkslateblue;
            }
            .cool-fact {
                color: darkgoldenrod;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Type: Big Cat</p>
            <p class="detail">Lives in: Mountain ranges of central Asia</p>
            <p class="detail">Diet: Deer , Goats and Wild Sheep</p>
            <p class="cool-fact">Cool Cool-fact: Can leep up to 15meters in one jump!</p>
        </div>
    </body>
</html>
