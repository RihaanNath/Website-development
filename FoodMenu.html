<!DOCTYPE html>
<html>
    <head>
        <title>My Food Menu</title>
        <style>
            body {
                font-family: Arial;
                background: #ece7e0;
                padding: 30px;
                text-align: center;
            }
            h1 {
                color: orangered;
            }
            h1+p {
                background-color:rgb(255, 161, 126) ;
                padding: 10px 20px;
                border-radius: 8px;
                display: inline-block;
            }
            ul {
                padding: 0;
                margin-top: 20px;
            }
            ul>li {
                list-style: none;
                font-size: 18px;
                font-weight: bold;
                color: #5d4037;
                padding: 10px 20px;
                margin: 6px auto;
                width: 260px;
                background: #fff3e0;
                border-radius: 8px;
            }
            ul li:nth-child(3) {
                background: #ffe082;
                color: #e65c00;
            }
            .desc {
                color: #555;
                margin-top: 20px;
                font-size: 15px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            .desc::first-letter {
                font-size: 220%;
                color:#e65c00;
                font-weight: bold;
            }
            .links {
                margin-top: 50px;
            }
            a {
                color: #e65c00;
                text-decoration: none;
                font-size: 15px;
                margin: 0 12px;
                padding: 8px 18px;
                border: 2px solid #e65c00 ;
                border-radius: 8px;
            }
            a:hover {
                background: #e65c00;
                color: white;
            }
            ul>li:hover {
                background: #ffe082;
                color: black;
            }

            

        </style>
    </head>

    </body>
</html>
