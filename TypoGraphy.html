<!DOCTYPE html>
<html>
    <haed>
        <title>My Superhero Card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial,sans-serif;
            }
            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }
            .tagline {
                font-size: italic;
                color: lightblue;
                text-transform: capitalize;
            }
            .label {
                text-transform: upercase;
                text-decoration: underline;
                color: orangered;
            }
            .power {
                font-weight: bold;
                color: chartreuse;
            }
            .weakness {
                text-decoration: line-through;
                color: chartreuse;
            }
            .badge {
                font-size: 28px;
                font-weight: bold;
                color: silver;
                transform: rotate(15deg);
            }
            .made-by {
                color: chartreuse;
                font-size: italic;
            }
        </style>

    </haed>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">The Most Powerful Hero In The School</p>
        <h2 class="label">super powers</h2>
        <p class="power">Can Run Faster Than A Cheetah</p>
        <p class="power">Can Lift A School Bus</p>
        <h2 class="label">weakness</h2>
        <p class="weakness">Math Homework</p>
        <p class="weakness">Broccoli</p>
        <p class="badge">Top Hero</p>
        <p class="made-by">Created by RIHAAN NATH</p>
    </body>
</html>
