<!DOCTYPE html>
<html>
    <head>
        <title>My Space Page</title>
        <style>
            body {
                background-color: rgba(33, 42, 172, 0.952);
                background-image: radial-gradient(to bottem, darkblue,green);
                background-repeat: no-repeat;
                background-position: top center;
                font-family: Arial, sans-serif;
            }
            .page-header {
                background-image: linear-gradient(to right, purple, coral
                );
                border-radius: 16px;
                text-align: center;
                color: white
            }
            .fact-card {
                background-color: darkgrey;
                border-radius: 12px;
                color: white;
            }
            .fact-card h2 {
                color: coral;
            }
            .star {
                width: 60px;
                height: 60px;
                background-color: yellow;
                border-radius: 50%;
                animation: twinkle 2s infinite alternate;
            }
            @keyframes twinkle {
                from { background-color: yellow; }
                to { background-color: white; }
            }
            .footer-text {
                text-align: center;
                color: coral;
            }

            
        </style>
    </head>
    <body>
        <div class="page-header">
            <h1>My Space Page</h1>
            <p>Welcome to my corner of the galaxy!</p>
        </div>
        <div class="fact-card">
            <h2>Fun Space Fact</h2>
            <p>The Sun is so big that one million earths could fit inside it.</p>
        </div>
        <div class="star"></div>
        <p class="footer-text">Made by RIHAAN NATH</p>
    </body>
</html>
